<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네트워크 분석 대시보드</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            border-bottom: 1px solid #21262d;
            padding-bottom: 1rem;
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            color: #58a6ff;
            font-weight: 600;
        }

        .header p {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 0.3rem;
        }

        .data-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.75rem;
            background-color: #0d1117;
            border-radius: 6px;
            border: 1px solid #21262d;
            font-size: 0.9rem;
        }

        .label {
            color: #8b949e;
            font-size: 0.85rem;
        }

        .value {
            color: #c9d1d9;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }

        .highlight {
            color: #79c0ff;
            font-weight: bold;
        }

        .notice {
            margin-top: 1.2rem;
            padding: 0.75rem;
            background-color: #1f242c;
            border-left: 3px solid #f0883e;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #8b949e;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>공개 네트워크 식별 정보</h1>
            <p>클라이언트 IP 기반 GeoIP & BGP 라우팅 분석 결과</p>
        </div>

        <div class="data-group">
            <div class="data-row">
                <span class="label">공용 IP 주소</span>
                <span class="value highlight" id="ip">조회 중...</span>
            </div>
            <div class="data-row">
                <span class="label">국가</span>
                <span class="value" id="country">-</span>
            </div>
            <div class="data-row">
                <span class="label">지역 / 도시</span>
                <span class="value" id="region">-</span>
            </div>
            <div class="data-row">
                <span class="label">인터넷 제공사 (ISP)</span>
                <span class="value" id="isp">-</span>
            </div>
            <div class="data-row">
                <span class="label">자율 시스템 (ASN)</span>
                <span class="value" id="asn">-</span>
            </div>
            <div class="data-row">
                <span class="label">노드 추정 좌표</span>
                <span class="value" id="coordinates">-</span>
            </div>
            <div class="data-row">
                <span class="label">시간대 (Timezone)</span>
                <span class="value" id="timezone">-</span>
            </div>
        </div>

        <div class="notice">
            * 표시된 좌표와 지역은 사용자의 실제 물리적 GPS가 아니며, 통신사 회선 집선 장비나 데이터센터 기준의 추정 위치입니다.
        </div>
    </div>

    <script>
        async function fetchNetworkInfo() {
            try {
                // 브라우저 CORS를 지원하는 공개 GeoIP 엔드포인트 호출
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('Network response error');
                
                const data = await response.json();

                document.getElementById('ip').textContent = data.ip || '미확인';
                document.getElementById('country').textContent = `${data.country_name || ''} (${data.country_code || '-'})`;
                document.getElementById('region').textContent = `${data.region || ''} ${data.city || ''}`.trim() || '미확인';
                document.getElementById('isp').textContent = data.org || data.isp || '미확인';
                document.getElementById('asn').textContent = data.asn || '미확인';
                document.getElementById('coordinates').textContent = (data.latitude && data.longitude) 
                    ? `${data.latitude.toFixed(3)}, ${data.longitude.toFixed(3)}` 
                    : '제공되지 않음';
                document.getElementById('timezone').textContent = data.timezone || '미확인';
            } catch (error) {
                document.getElementById('ip').textContent = '데이터 조회 실패';
                document.getElementById('ip').classList.remove('highlight');
            }
        }

        window.addEventListener('DOMContentLoaded', fetchNetworkInfo);
    </script>
</body>
</html>
