        .info-list{display:flex;flex-direction:column;gap:.7rem;text-align:left;border-top:1px solid var(--border);padding-top:1.2rem}
        .info-item{display:flex;justify-content:space-between;align-items:flex-start;font-size:.85rem;gap:.5rem}
        .label{color:var(--muted);flex-shrink:0}
        .value{color:var(--text);font-weight:500;text-align:right;word-break:break-all;max-width:65%}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
