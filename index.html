<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 정보 조회기</title>
    <style>
        body {
            background-color: #121212;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .box {
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }
        input {
            flex: 1;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }
        button {
            padding: 8px 16px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .result {
            font-size: 0.9rem;
            line-height: 1.8;
            border-top: 1px solid #333;
            padding-top: 1rem;
        }
        .row {
            display: flex;
            justify-content: space-between;
        }
        .label { color: #888; }
        .val { color: #60a5fa; font-weight: 500; }
    </style>
</head>
<body>

<div class="box">
    <div class="input-group">
        <input type="text" id="target-ip" value="59.13.193.68" placeholder="조회할 IP 입력">
        <button onclick="lookupIP()">조회</button>
    </div>

    <div class="result" id="output">
        <div class="row"><span class="label">IP:</span> <span class="val" id="res-ip">-</span></div>
        <div class="row"><span class="label">국가:</span> <span class="val" id="res-country">-</span></div>
        <div class="row"><span class="label">도시:</span> <span class="val" id="res-city">-</span></div>
        <div class="row"><span class="label">ISP:</span> <span class="val" id="res-isp">-</span></div>
        <div class="row"><span class="label">ASN:</span> <span class="val" id="res-asn">-</span></div>
    </div>
</div>

<script>
    async function lookupIP() {
        const ip = document.getElementById('target-ip').value.trim();
        if (!ip) return;

        document.getElementById('res-ip').textContent = '조회 중...';

        try {
            const res = await fetch(`https://ipapi.co/${ip}/json/`);
            const data = await res.json();

            if (data.error) {
                alert('유효하지 않은 IP 주소입니다.');
                return;
            }

            document.getElementById('res-ip').textContent = data.ip;
            document.getElementById('res-country').textContent = `${data.country_name} (${data.country_code})`;
            document.getElementById('res-city').textContent = `${data.region || ''} ${data.city || ''}`.trim() || '미확인';
            document.getElementById('res-isp').textContent = data.org || data.isp || '미확인';
            document.getElementById('res-asn').textContent = data.asn || '미확인';
        } catch (e) {
            document.getElementById('res-ip').textContent = '조회 실패';
        }
    }

    // 초기 로드 시 59.13.193.68 자동 조회
    lookupIP();
</script>

</body>
</html>
