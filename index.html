<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 네트워크 접속 정보</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            background: #1e1e1e;
            width: 100%;
            max-width: 420px;
            padding: 1.8rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .title {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 0.5rem;
        }

        .ip-highlight {
            font-size: 1.8rem;
            font-weight: 700;
            color: #3b82f6;
            background: #262626;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            word-break: break-all;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
            border-top: 1px solid #333333;
            padding-top: 1.2rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .label {
            color: #aaaaaa;
        }

        .value {
            color: #f3f4f6;
            font-weight: 500;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">현재 접속 중인 내 IP 주소</div>
    <div class="ip-highlight" id="my-ip">확인 중...</div>

    <div class="info-list">
        <div class="info-item">
            <span class="label">통신사 (ISP)</span>
            <span class="value" id="my-isp">-</span>
        </div>
        <div class="info-item">
            <span class="label">지역 / 도시</span>
            <span class="value" id="my-location">-</span>
        </div>
        <div class="info-item">
            <span class="label">국가</span>
            <span class="value" id="my-country">-</span>
        </div>
        <div class="info-item">
            <span class="label">식별 번호 (ASN)</span>
            <span class="value" id="my-asn">-</span>
        </div>
    </div>
</div>

<script>
    // 페이지 로드 시 접속자 본인의 IP와 네트워크 메타데이터를 자동 조회
    async function getMyNetworkData() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            if (!response.ok) throw new Error();

            const data = await response.json();

            // 가져온 본인 정보 화면에 바인딩
            document.getElementById('my-ip').textContent = data.ip;
            document.getElementById('my-isp').textContent = data.org || data.isp || '미확인';
            document.getElementById('my-location').textContent = `${data.region || ''} ${data.city || ''}`.trim() || '미확인';
            document.getElementById('my-country').textContent = `${data.country_name} (${data.country_code})`;
            document.getElementById('my-asn').textContent = data.asn || '미확인';
        } catch (error) {
            document.getElementById('my-ip').textContent = '조회 실패';
        }
    }

    window.addEventListener('DOMContentLoaded', getMyNetworkData);
</script>

</body>
</html>
